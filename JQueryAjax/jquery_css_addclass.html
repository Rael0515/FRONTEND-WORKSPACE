<!DOCTYPE html>
<html>
  <head>
    <script src="http://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
      $(document).ready(function () {
        $("button").click(function () {
          $("#div1").addClass("warning");
        });
      });
    </script>
    <style>
      .warning {
        border: 1px solid black;
        background-color: yellow;
      }
    </style>
  </head>
  <body>
    <div id="div1">
      <p>예제 단락입니다.</p>
    </div>
    <br />
    <button>a</button>
  </body>
</html>
